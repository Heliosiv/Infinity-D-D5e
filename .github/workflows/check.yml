name: check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  source-gate:
    name: Fast source gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The manifest gate compares source versions with released tags.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium for browser-backed source checks
        run: npx --yes playwright install --with-deps chromium
      - name: Select the changed UI audit scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "INFINITY_UI_AUDIT_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            echo "INFINITY_UI_AUDIT_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi
          echo "INFINITY_UI_AUDIT_HEAD=${{ github.sha }}" >> "$GITHUB_ENV"
      - name: Verify source and changed UI surfaces
        run: npm run verify:source:fast

  package:
    name: Build and inspect clean package
    needs: source-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Confirm clean checkout
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"
      - name: Build release package
        run: npm run release:nocheck
      - name: Independently inspect release package
        run: node scripts/verify-release-artifact.mjs
      - name: Confirm packaging did not modify tracked source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"
