name: check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  # Core quality gate: the full bespoke test suite. Blocking.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so the manifest release-state gate in
          # test-manifest-compat.mjs can compare against released tags.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check

  # Prettier formatting. Blocking.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check

  # Headless-Chromium layout, reachability, action-wiring, and accessibility audits. Blocking.
  ui-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium for the UI harness
        run: npx --yes playwright install --with-deps chromium
      - run: npm run ui:audit
      - run: npm run ui:audit:a11y
      - run: npm run ui:audit:keyboard
