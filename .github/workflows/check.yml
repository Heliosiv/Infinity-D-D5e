name: check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  source-gate:
    name: Full source gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The manifest gate compares source versions with released tags.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium for browser-backed source checks
        run: npx --yes playwright install --with-deps chromium
      - name: Verify source, UI, accessibility, keyboard, and manifest
        run: npm run verify:source

  package:
    name: Build and inspect clean package
    needs: source-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Confirm clean checkout
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"
      - name: Build release package
        run: npm run release:nocheck
      - name: Independently inspect release package
        run: node scripts/verify-release-artifact.mjs
      - name: Confirm packaging did not modify tracked source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"
