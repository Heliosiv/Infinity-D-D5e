name: release draft

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-draft:
    name: Verify tag and prepare draft release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium for browser-backed source checks
        run: npx --yes playwright install --with-deps chromium
      - name: Run the full source gate from the tagged commit
        run: npm run verify:source
      - name: Confirm clean tagged checkout
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"
      - name: Build versioned release package
        env:
          INFINITY_RELEASE_REPO: ${{ github.repository }}
        run: npm run release:nocheck
      - name: Verify tag, versions, archive, manifest references, and hash
        run: >-
          node scripts/verify-release-artifact.mjs
          --tag "$RELEASE_TAG"
          --repository "$RELEASE_REPOSITORY"
      - name: Confirm packaging did not modify tracked source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"
      - name: Create or update draft GitHub release
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            release/module.zip
            release/module.json
            release/module.zip.sha256.txt
          )
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to alter an already-published release for $RELEASE_TAG." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --title "Infinity D&D5e $RELEASE_TAG" \
              --notes-file release/RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$RELEASE_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$RELEASE_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Infinity D&D5e $RELEASE_TAG" \
              --notes-file release/RELEASE_NOTES.md
          fi
          echo "Draft release assets uploaded. Publication still requires a human action."
