name: full UI gate

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1-5"

permissions:
  contents: read

jobs:
  source-gate:
    name: Full UI and accessibility gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium for browser-backed source checks
        run: npx --yes playwright install --with-deps chromium
      - name: Verify all UI surfaces, accessibility, and keyboard journeys
        run: npm run verify:source
